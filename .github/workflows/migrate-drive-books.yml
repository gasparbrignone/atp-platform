name: Migrar libros de Google Drive

# Corre cuando se edita/crea una entrada de la Biblioteca (vía CMS o commit
# directo). scripts/migrate-drive-books.mjs decide entrada por entrada si
# hay algo para hacer: solo procesa las que tienen `driveUrl` pero todavía
# no `downloadUrl` — así una entrada ya migrada no se vuelve a tocar.
on:
  push:
    branches: [main]
    paths:
      - 'src/content/books/**.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migrate-drive-books
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # El GITHUB_TOKEN por defecto no dispara otros workflows al hacer
          # push (para evitar loops infinitos) — necesitamos que el commit
          # de este job SÍ dispare "Deploy to GitHub Pages", así que usamos
          # un Personal Access Token propio en su lugar (ver
          # docs/STACK_DECISIONS.md → Biblioteca, y el secret RELEASES_PAT).
          token: ${{ secrets.RELEASES_PAT }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Instalar gdown
        # gdown maneja la descarga de Drive incluyendo el "confirm token" que
        # pide para archivos grandes (el aviso de "no se puede escanear por
        # virus") — reimplementar eso a mano no vale la pena.
        run: pip install gdown

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Migrar libros pendientes
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/migrate-drive-books.mjs

      - name: Commitear y pushear si hubo cambios
        env:
          GIT_AUTHOR_NAME: atp-bot
          GIT_AUTHOR_EMAIL: atp-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: atp-bot
          GIT_COMMITTER_EMAIL: atp-bot@users.noreply.github.com
        # El push puede perder la carrera contra un commit nuevo en `main`
        # (alguien editando el CMS, u otro push) que llegó después del
        # checkout de este job — reintenta con rebase en vez de fallar la
        # corrida entera. 10 intentos con espera aleatoria (no siempre el
        # mismo intervalo, para no perder la carrera contra otro reintento
        # con el mismo timing) en vez de 5 con backoff fijo: en producción,
        # con varios commits seguidos llegando a `main` (edición activa por
        # CMS), 5 intentos alcanzaron a agotarse igual.
        #
        # Si el rebase mismo falla (conflicto real, no solo una carrera —
        # rarísimo, implicaría que alguien tocó a mano el mismo campo que
        # este bot en el mismo libro) se aborta ese intento en vez de
        # segir con un rebase a medio terminar.
        run: |
          if git diff --quiet -- src/content/books; then
            echo "Sin cambios para commitear."
            exit 0
          fi

          git add src/content/books
          git commit -m "chore: migrar libros de Google Drive a GitHub Releases"

          for attempt in $(seq 1 10); do
            if git push; then
              exit 0
            fi
            echo "Push rechazado (intento $attempt), reintentando con rebase..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase con conflicto real, no solo una carrera — abortando."
              git rebase --abort
              exit 1
            fi
            sleep $((RANDOM % 10 + attempt * 2))
          done

          echo "No se pudo pushear después de varios intentos. Es seguro volver a" \
               "correr este workflow más tarde (workflow_dispatch): el script solo" \
               "toca los libros que todavía no tienen downloadUrl."
          exit 1
